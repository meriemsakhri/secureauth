services:
  postgres:
    image: postgres:17
    container_name: secureauth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - secureauth-pgdata:/var/lib/postgresql/data

volumes:
  secureauth-pgdata: