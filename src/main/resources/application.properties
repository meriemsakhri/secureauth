spring.application.name=secureauth

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:secureauth_db}
spring.datasource.username=${DB_USERNAME:secureauth_admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

app.security.max-failed-attempts=5
app.security.lockout-duration-minutes=15

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

app.security.password-reset-expiration-minutes=15